<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAWAI SHOP — Anime Store</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="sparkle">✨</span> KAWAI SHOP <span class="sparkle">✨</span>
    </div>
    <div class="cart-btn-wrapper" onclick="toggleCartModal()">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cart-count">0</span>
    </div>
  </header>

  <!-- E'lon / Banner -->
  <div class="info-banner">
    <p>🚚 Dastavka: 12-16 kun | 💳 50% oldindan to'lov</p>
  </div>

  <!-- Kategoriyalar / Filtr -->
  <nav class="categories">
    <button class="cat-btn active" onclick="filterProducts('all')">Barchasi</button>
    <button class="cat-btn" onclick="filterProducts('haykal')">Haykalchalar</button>
    <button class="cat-btn" onclick="filterProducts('hoodie')">Xudilar</button>
    <button class="cat-btn" onclick="filterProducts('aksessuar')">Aksessuarlar</button>
    <button class="cat-btn" onclick="filterProducts('kantselariya')">Kantselariya</button>
  </nav>

  <!-- Mahsulotlar Katalogi -->
  <main class="products-grid" id="products-container">
    <!-- JS orqali dinamik mahsulotlar yuklanadi -->
  </main>

  <!-- Savatcha Modali -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🛒 Sizning Savatchangiz</h3>
        <button class="close-btn" onclick="toggleCartModal()">&times;</button>
      </div>
      <div class="cart-items" id="cart-items-container">
        <!-- Savatcha elementlari -->
      </div>
      <div class="cart-footer">
        <div class="total-price">
          <span>Jami:</span>
          <strong id="cart-total-price">0 so'm</strong>
        </div>
        <p class="delivery-info">* Dastavka taxminan 30 000 so'm</p>
        <button class="checkout-btn" onclick="sendOrder()">
          <i class="fa-brands fa-telegram"></i> Buyurtma berish
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
